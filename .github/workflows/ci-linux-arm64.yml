# MyCast CI —— linux/arm64 平台独立构建（纯手动触发，不做自动触发）。
#
# 触发：仅在 Actions 页手动点 Run workflow（workflow_dispatch only）。
# 职责：盒子/ARM 设备产物
name: ci-linux-arm64

on:
  workflow_dispatch: # 纯手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: 交叉编译 linux/arm64（零 CGo 硬约束）
        run: cd go && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/mycast-linux-arm64 ./cmd/mycast
