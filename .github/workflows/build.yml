# MyCast 构建守护 CI —— 纯手动触发（不在 push/PR/tag 时自动跑）。
#
# 守护新路线（Go 后端 + 嵌入式 JS 引擎 + HTTP-first）的核心资产：
#   - 零 CGo 硬约束：CGO_ENABLED=0 下四平台交叉编译必须全过（否则 android/arm64 断）
#   - 全量单测：含 JA3/Akamai HTTP/2 指纹断言（TestJA3Fingerprint / TestAkamaiH2Fingerprint）
#   - 纯静态校验：linux 产物必须是静态链接（单二进制拷贝即跑，零依赖）
#
# 触发：仅在 Actions 页手动点 Run workflow。要跑就点一下。
name: build

on:
  workflow_dispatch: # 纯手动触发，不做任何自动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: 全量单测（含 JA3/Akamai 指纹断言）
        run: cd go && go test ./... -timeout 300s

      - name: 交叉编译矩阵（零 CGo 硬约束）
        run: |
          cd go
          set -e
          for t in "android arm64" "linux amd64" "linux arm64" "windows amd64"; do
            set -- $t
            echo "=== $1/$2 ==="
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -o /tmp/mycast-$1-$2 ./cmd/mycast
          done

      - name: 纯静态校验（linux/amd64 产物非动态链接）
        run: |
          if ldd /tmp/mycast-linux-amd64 2>&1 | grep -qiE "not a dynamic|statically"; then
            echo "✅ linux/amd64 纯静态链接"
          else
            echo "❌ linux/amd64 非静态链接（违背零依赖约束）"
            ldd /tmp/mycast-linux-amd64
            exit 1
          fi
