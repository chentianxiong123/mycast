<style>
:root{
  --bg:#0a0b0e;--bg2:#0f1118;--card:#141720;--card2:#1a1e2a;
  --line:#222838;--fg:#e4e9f2;--dim:#5e6880;--dim2:#3a4358;
  --acc:#ff4d6d;--acc-soft:rgba(255,77,109,.12);--ok:#34d399;--warn:#fbbf24;
}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  padding:0;max-width:500px;margin:0 auto;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── 主内容区（给底部 tab 留空间）── */
.main{padding:16px 16px 84px;min-height:100vh}

/* header */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),#ff8a5c);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hdr-t{flex:1;min-width:0}
.hdr-t h1{font-size:15px;font-weight:700}
.hdr-t .sub{font-size:10px;color:var(--dim);word-break:break-all;margin-top:1px}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 1.4s infinite;flex-shrink:0}
@keyframes blink{50%{opacity:.25}}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px}
.card h2{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}

/* ── 资源嗅探 ── */
.sniffrow{display:flex;gap:10px;margin-bottom:8px;align-items:center}
.inp{flex:1;height:40px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--fg);font-size:13px;outline:none;min-width:0}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,77,109,.12)}
/* 搜索引擎下拉：深底浅字（WebKitGTK 原生 select 默认白底蓝字看不清） */
/* 所有下拉（搜索引擎/日志等级等）：深底浅字。WebKitGTK 原生 select 白底黑字、忽略 CSS background，须 appearance:none 强制 */
select.inp{appearance:none;-webkit-appearance:none;background:var(--card2);color:var(--fg);border:1px solid var(--line);padding:0 24px 0 10px}
select.inp option{background:var(--card2);color:var(--fg)}
.sniffeps{font-size:11px;color:var(--dim)}
.eps{max-height:240px;overflow-y:auto}
.ep{display:flex;align-items:center;gap:7px;padding:5px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.ep:hover{background:var(--card2)}
.epi{width:22px;height:22px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.ept{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epu{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right;font-size:10px}
.warn{color:#fbbf24}
.dim{color:var(--dim)}

/* ── 集数网格（参考 mymusic EpisodePicker：grid + 分页 + 复制/播放）── */
.ep-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ep-title{font-size:12px;font-weight:700}
.ep-total{font-size:11px;color:var(--dim)}
.ep-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:260px;overflow-y:auto}
.ep-cell{height:34px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;user-select:none;transition:all .12s}
.ep-cell:active{transform:scale(.94)}
.ep-cell.on{border-color:var(--acc);background:linear-gradient(180deg,rgba(255,77,109,.18),transparent);color:var(--acc)}
 .ep-pager{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
/* 搜索分页（固定卡片底部，不跟结果滚；居中 + 圆角胶囊 + 当前页高亮） */
.search-pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.search-pager .sp-btn{min-width:60px;height:34px;padding:0 16px;background:var(--card2);border:1px solid var(--line);border-radius:17px;color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center}
.search-pager .sp-btn:active{transform:scale(.96);background:var(--card)}
.search-pager .sp-btn:disabled{opacity:.3;cursor:default;border-color:transparent}
.search-pager .sp-cur{font-size:12px;color:var(--dim);min-width:56px;text-align:center}
.search-pager .sp-cur b{color:var(--acc);font-size:15px;font-weight:700}
.ep-pg{min-width:30px;height:26px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line);border-radius:7px;font-size:11px;cursor:pointer}
.ep-pg.on{border-color:var(--acc);color:var(--acc)}
.ep-detail{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.ep-dt{font-size:12px;font-weight:600;margin-bottom:6px;word-break:break-all}
.ep-actions{display:flex;gap:8px}
.ep-actions .btn{flex:1;width:auto;margin-top:0;height:38px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.hidden{display:none}
.sres{font-size:13px} /* 结果列表不自己滚，跟整体页滚（只一个滚动条） */
.sr{display:flex;flex-direction:column;gap:2px;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.sr:hover{background:var(--card2)}
.sr-t{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-u{color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-e{font-size:9px;color:var(--acc);font-weight:700;text-transform:uppercase}

/* ── 搜索结果页（独立页，效仿 searxng 聚合）── */
.sx-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.sx-tab{flex-shrink:0;padding:5px 12px;border-radius:8px;font-size:11px;color:var(--dim);background:var(--card2);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.sx-tab.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.sx-item{display:flex;gap:9px;padding:10px 8px;border-bottom:1px solid var(--line)}
.sx-item:last-child{border-bottom:none}
.sx-ico{width:20px;height:20px;border-radius:4px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px}
.sx-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.sx-title{font-size:13px;font-weight:600;color:#6aa3ff;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sx-title:hover{text-decoration:underline}
.sx-url{font-size:10px;color:var(--ok);word-break:break-all}
.sx-desc{font-size:11px;color:var(--dim);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sx-meta{display:flex;align-items:center;gap:6px;margin-top:2px}
.sx-eng{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--acc);background:var(--acc-soft);padding:1px 6px;border-radius:4px}
.sx-cat{font-size:9px;color:var(--dim)}
.sr-back{display:flex;align-items:center;gap:8px}
.sr-back-t{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 首页：家庭影院 ── */
.hero-q{font-size:20px;font-weight:800;margin-bottom:10px}
/* 搜索框：一个圆角容器，里面引擎(左)+输入(中)+搜索按钮(右，框内) */
.search-box{display:flex;align-items:stretch;background:var(--card2);border:1px solid var(--line);border-radius:14px;height:52px;overflow:hidden;margin-bottom:10px}
/* 搜索记录（合并进搜索框下方：标题+最近搜过列表，点一下重搜） */
.search-hist{margin-top:4px}
.search-hist .sh-title{font-size:12px;font-weight:700;color:var(--dim);margin:12px 0 8px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.search-hist .sh-clear{background:none;border:none;color:var(--dim);font-size:12px;padding:3px 8px;border-radius:8px;cursor:pointer}
.search-hist .sh-clear:hover{background:rgba(255,255,255,.08);color:var(--text)}
.search-hist .sh-empty{font-size:12px;color:var(--dim);padding:8px 0}
.search-box:focus-within{border-color:var(--acc)}
/* 引擎选择：清晰可见（不透明底 + 加粗 + 下拉箭头 + 深色 option，WebKit 须 appearance:none 强制） */
.search-engine{flex:0 0 auto;width:80px;height:100%;background:var(--card);border:none;border-right:1px solid var(--line);color:var(--fg);font-size:13px;font-weight:700;padding:0 24px 0 12px;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%23fff' fill='none' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:10px}
.search-engine option{background:var(--card2);color:var(--fg)}
.search-input{flex:1;min-width:0;height:100%;background:transparent;border:none;color:var(--fg);font-size:15px;padding:0 12px;outline:none}
.search-input::placeholder{color:var(--dim)}
/* 搜索按钮：圆形图标（半透明深色底 + 放大镜，hover/active 变 accent，不抢戏） */
.net-off{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:999;background:rgba(255,180,60,.16);border:1px solid rgba(255,180,60,.5);color:#ffcf80;padding:6px 14px;border-radius:20px;font-size:12px;white-space:nowrap}
.search-go{flex:0 0 auto;width:40px;height:40px;margin:6px;background:var(--card);border:none;border-radius:50%;color:var(--dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.search-go:hover{color:var(--fg);background:var(--card2)}
.search-go:active{transform:scale(.9);color:var(--acc);background:var(--card)}
.big-inp{height:46px;font-size:15px;border-radius:12px}
.big-btn{height:46px;font-size:14px;padding:0 22px;border-radius:12px}
.banner{margin-bottom:10px}
.banner-in{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(255,77,109,.14),transparent);border:1px solid rgba(255,77,109,.35);border-radius:13px;padding:10px 12px;cursor:pointer}
.banner-ic{font-size:22px}
.banner-t{flex:1;min-width:0}
.banner-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner-sub{font-size:10px;color:var(--dim)}
.banner-arrow{font-size:18px;color:var(--acc)}
.recent{display:flex;flex-direction:column;gap:6px}
.recent-it{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.recent-it:active{transform:scale(.98)}
.recent-t{flex:1;min-width:0}
.recent-title{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-sub{font-size:10px;color:var(--dim)}
.recent-go{color:var(--acc);font-size:16px}
.ep-loading{padding:14px 0;text-align:center;color:var(--dim);font-size:12px}

/* page */
.page{display:none}
.page.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* ── 大状态卡（首页）── */
.hero{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:12px}
.hero-ic{font-size:44px;margin-bottom:8px}
.hero-t{font-size:16px;font-weight:800;letter-spacing:-.01em}
.hero-s{font-size:11px;color:var(--dim);margin-top:4px}
.hero-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:10px}
.hero-badge.idle{background:var(--acc-soft);color:var(--acc)}
.hero-badge.live{background:rgba(52,211,153,.14);color:var(--ok)}

/* stat grid */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.si{background:var(--card2);border-radius:8px;padding:8px 10px;min-width:0}
.si .sl{font-size:9px;color:var(--dim2);font-weight:600;letter-spacing:.08em;margin-bottom:2px}
.si .sv{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .sv.dim{color:var(--dim)}.si .sv.ok{color:var(--ok)}.si .sv.warn{color:var(--warn)}
.si .sv.link{font-size:9px;color:var(--dim);word-break:break-all;white-space:normal;max-height:2em;overflow:hidden}

/* ── 操作台（大播放控制）── */
.dock{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;
}
.dock-cover{
  width:100%;aspect-ratio:16/9;border-radius:12px;margin-bottom:14px;
  background:linear-gradient(135deg,#1e2432,#141720);display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.dock-cover .cover-tv{font-size:52px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.dock-cover .cover-live{position:absolute;top:10px;left:10px;font-size:9px;font-weight:700;color:#fff;background:var(--acc);padding:2px 8px;border-radius:4px;letter-spacing:.05em}
.dock-title{font-size:15px;font-weight:800;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-sub{font-size:10px;color:var(--dim);margin-bottom:14px}

/* 大进度条 */
.bigseek{position:relative;padding:12px 0;cursor:pointer;touch-action:none}
.bigseek-track{height:8px;background:var(--line);border-radius:5px;position:relative}
.bigseek-fill{position:absolute;left:0;top:0;height:100%;background:var(--acc);border-radius:5px;width:0}
.bigseek-knob{position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.bigseek.dragging .bigseek-knob{transform:translate(-50%,-50%) scale(1.3)}
.bigseek-time{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.bigseek-time .cur{color:var(--fg);font-weight:700}

/* 大控制按钮 */
.bigbtns{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 6px;height:auto}
.bbtn{
  width:52px;height:52px;min-height:0;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;user-select:none;flex-shrink:0;padding:0;line-height:1;
}
.bbtn:active{transform:scale(.9)}
.bbtn.main{width:64px;height:64px;font-size:26px;background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 20px rgba(255,77,109,.35)}
.bbtn.sm{width:42px;height:42px;font-size:15px}
.bbtn:hover{border-color:var(--dim)}

/* 音量（大） */
.bigvol{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.bigvol .vic{font-size:14px;width:20px;text-align:center}
.bigvol .vnum{font-size:11px;color:var(--dim);width:28px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range].vrange{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--line);outline:none;cursor:pointer}
input[type=range].vrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}
input[type=range].vrange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;cursor:pointer}

/* 操作台小按钮 */
.dock-meta{display:flex;gap:6px;margin-top:12px}
.dock-meta .dm{flex:1;font-size:10px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center}
.dock-meta .dm b{display:block;font-size:12px;color:var(--fg);margin-top:2px;font-variant-numeric:tabular-nums}

/* ── 设备气泡 ── */
.bubbles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bub{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:13px 8px 10px;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s;position:relative;user-select:none}
.bub:hover{border-color:var(--dim);transform:translateY(-1px)}
.bub.on{border-color:var(--acc);background:linear-gradient(180deg,rgba(255,77,109,.1),transparent);box-shadow:0 4px 16px rgba(255,77,109,.15)}
.bub .bub-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:7px;flex-shrink:0}
.bub .bub-ic.tv{background:rgba(96,165,250,.12)}
.bub.on .bub-ic.tv{background:rgba(255,77,109,.2)}
.bub .bub-ic.self{background:rgba(52,211,153,.1)}
.bub .bub-name{font-size:11px;font-weight:700;text-align:center;word-break:break-all;line-height:1.3}
.bub .bub-ip{font-size:9px;color:var(--dim2);margin-top:2px}
.bub .bub-tag{position:absolute;top:6px;right:8px;font-size:8px;font-weight:700;padding:1px 6px;border-radius:4px}
.bub .bub-tag.self{background:rgba(52,211,153,.15);color:var(--ok)}
.bub .bub-tag.on{background:var(--acc);color:#fff}
.bub-empty{grid-column:1/-1;font-size:11px;color:var(--dim2);text-align:center;padding:14px;background:var(--bg2);border-radius:9px;line-height:1.5}

/* btn */
.btn{border:0;border-radius:8px;min-height:38px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.94)}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--dim);display:block;width:100%;margin-top:8px}
.btn.gh:active{border-color:var(--dim);color:var(--fg)}
/* 行内按钮（嗅探/搜索行的「嗅探」「搜索」，覆盖 .btn.gh 的整行样式，避免挤在一起）*/
.sniffrow .btn{width:auto;margin-top:0;flex-shrink:0;height:40px;padding:0 18px;border-radius:10px;font-size:12px;color:var(--fg);border-color:var(--line);background:var(--card2)}
.sniffrow .btn:active{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#fff;border:0;padding:8px 16px}
.btn.main{background:var(--acc);color:#fff}

/* err */
.errbar{margin-top:8px;padding:7px 10px;font-size:10px;color:var(--acc);background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.18);border-radius:7px;word-break:break-all}

/* logs */
.logs{font-family:"SF Mono",ui-monospace,monospace;font-size:9.5px;color:var(--dim2);max-height:300px;overflow-y:auto;background:var(--bg2);border-radius:8px;padding:8px 10px;line-height:1.7}
.logs div{white-space:pre-wrap;word-break:break-all}

/* toast */
/* toast 全局固定：之前嵌在设备页，离开设备页所有提示都看不见 */
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:95;max-width:88vw;padding:9px 16px;border-radius:20px;background:rgba(20,23,32,.94);border:1px solid var(--line);font-size:12px;text-align:center;display:none;backdrop-filter:blur(8px)}
#toast:not(:empty){display:block}
#toast .ok{color:var(--ok)}#toast .err{color:var(--acc)}
/* 层叠页（遥控器/设备）：不在底部导航，靠返回按钮退回来源页 */
.layer-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.layer-bar .btn{width:auto;margin:0;flex:0 0 auto}
.layer-bar b{font-size:14px}

/* ── 底部导航 ── */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;
  background:rgba(12,13,16,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:10px;cursor:pointer;color:var(--dim);transition:all .15s;user-select:none}
.tab .ti{font-size:17px;line-height:1}
.tab .tt{font-size:9px;font-weight:700}
.tab.active{color:var(--acc)}
.tab.active .ti{transform:scale(1.1)}
.tab .tbadge{position:relative}
.tab .tbadge::after{content:'';position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--acc)}

/* 日志：两级滚动（页面外层照旧 + 日志区内层独立滚动），滚动条常驻可见 */
.logbox{
  height:calc(100vh - 250px);min-height:240px;
  overflow-y:auto;overflow-x:hidden;
  border:1px solid var(--line);border-radius:10px;
  background:var(--bg2);padding:10px 12px;
  scrollbar-width:thin;scrollbar-color:var(--dim2) transparent;
}
.logbox::-webkit-scrollbar{width:8px}
.logbox::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
.logbox::-webkit-scrollbar-thumb{background:var(--dim2);border-radius:8px}
.logbox::-webkit-scrollbar-thumb:hover{background:var(--dim)}
.logbox > div{font-size:11px;line-height:1.65;padding:1px 0;white-space:pre-wrap;word-break:break-all}
/* 日志工具栏：输入/下拉/清空/暂停统一 40px 高，图标按钮给足点击面积 */
.log-toolbar{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.log-toolbar .inp{height:40px;min-height:40px}
.log-toolbar select{max-width:90px;flex:0 0 auto;height:40px;font-size:12px}
.log-toolbar .btn{height:40px;min-height:40px;min-width:58px;padding:0 14px;font-size:13px;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:10px}
.log-toolbar #log-pause-btn{min-width:48px;font-size:16px;line-height:1}

.hidden{display:none!important}

/* ═══════════ 媒体库（移植 OnScreen：继续观看行 + 海报墙）═══ */
.lib-sec{margin-bottom:14px}
.lib-sec h2{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.row-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
/* 继续观看大卡（学 OnScreen ContinueWatching）*/
.continue-card{flex:0 0 auto;width:200px;position:relative}
.continue-img{width:200px;height:112px;border-radius:10px;background:var(--card2);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:var(--acc);cursor:pointer}
/* 进度条带底槽：0% 不画，避免“没看也满格”的假进度 */
.continue-progress-track,.poster-progress-track{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}
.continue-progress,.poster-progress{height:100%;background:var(--acc)}
.continue-title{font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.continue-sub{font-size:10px;color:var(--dim);margin-top:2px}
.continue-dismiss{position:absolute;top:5px;right:5px;z-index:2;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.continue-dismiss:disabled{opacity:.5;cursor:progress}
.lib-empty{padding:28px 4px;text-align:center;color:var(--dim);font-size:12px}
.lib-empty .btn{margin-top:12px}
/* 海报卡（学 OnScreen Row/LibraryRow）*/
.poster-card{flex:0 0 auto;width:110px;cursor:pointer}
.poster-img{width:110px;height:155px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:var(--acc);overflow:hidden;position:relative}
.poster-real{width:100%;height:100%;object-fit:cover}
.continue-real{width:100%;height:100%;object-fit:cover}
.poster-unfav{color:var(--dim);font-size:12px;margin-left:6px;padding:2px 4px}
.poster-unfav:active{color:var(--acc)}
.poster-title{font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster-sub{font-size:9px;color:var(--dim);margin-top:1px}

/* ═══════════ 详情浮层（学 OnScreen ItemDetail：封面+标题+集数网格）═══ */
.detail-overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* 封面按 2:3 海报比例居中展示，不再把竖版海报裁成横条 */
.detail-cover{height:auto;flex-shrink:0;padding:16px;background:linear-gradient(135deg,var(--card2),var(--bg2));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.cover-photo{width:132px;aspect-ratio:2/3;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:54px;font-weight:900;color:var(--acc);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.cover-photo img{width:100%;height:100%;object-fit:cover;display:block}
.detail-body{flex:1;min-height:0;padding:14px 14px 12px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dim2) transparent}
.detail-title{font-size:20px;font-weight:800;margin-bottom:5px}
.detail-meta{font-size:11px;margin-bottom:12px}
.detail-meta.fail{color:#ff8a8a;font-size:12px}
.detail-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.detail-card .row{font-size:12px;line-height:1.7;color:var(--dim);display:flex;gap:6px}
.detail-card .row .k{color:var(--dim);flex-shrink:0;min-width:32px;opacity:.7}
.detail-card .row .v{color:var(--txt);flex:1;word-break:break-all}
.detail-card .row.empty{display:none}
.detail-synopsis{font-size:12px;line-height:1.6;color:var(--dim);margin-top:8px;max-height:4.8em;overflow:hidden}
.detail-synopsis.open{max-height:none}
.detail-synopsis-toggle{color:var(--acc);font-size:11px;cursor:pointer;margin-top:4px;display:inline-block}
.detail-eps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.detail-ep{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 4px;text-align:center;cursor:pointer;font-size:11px;color:var(--dim)}
.detail-ep:active{transform:scale(.96)}
.detail-ep.sel{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
/* 底栏是 flex last child，不 fixed：浮层内只有 detail-body 一个滚动条 */
.detail-bar{flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px;background:var(--bg);border-top:1px solid var(--line)}
.detail-bar .btn{min-height:44px;height:44px;border-radius:10px;font-size:13px;padding:0 6px}
.detail-close-btn{background:var(--card2);color:var(--dim)}
.detail-play-btn:disabled{opacity:.4}

/* ═══════════ 内置播放器（ArtPlayer 现代 UI + hls.js 解码）═══ */
.player-overlay{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.artplayer-app{flex:1;width:100%;min-height:0;overflow:hidden}
.player-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 14px;z-index:82;pointer-events:none;background:linear-gradient(rgba(0,0,0,.75),transparent)}
.player-title{flex:1;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-btn{pointer-events:auto;width:36px;height:36px;flex:0 0 auto;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(20,23,32,.68);color:#fff;font-size:15px;cursor:pointer}
.player-btn:active{background:rgba(255,255,255,.3)}
.player-btn:disabled{opacity:.35;cursor:default}
.player-tap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:83;padding:14px 26px;border:1px solid rgba(255,255,255,.3);border-radius:28px;background:rgba(20,23,32,.85);color:#fff;font-size:16px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}
.player-tap:active{background:rgba(255,77,109,.7)}
</style>
</head>
<body>

<div class="main">
  <div class="hdr">
    <div class="logo">▶</div>
    <div class="hdr-t">
      <h1>MyCast</h1>
    </div>
    <div class="hdr-dot" title="在线"></div>
  </div>

  <!-- ═══════════ 首页（家庭影院：搜索 → 选站 → 集数 → 投屏，一条主链路）═══════════ -->
  <div class="page active" id="page-search">
    <!-- 搜索（想看什么 card：搜索框 + 搜索记录 + 结果区，全在一个框里）-->
    <div class="card">
      <div class="hero-q">想看什么？</div>
      <!-- 搜索框：一个圆角容器，里面引擎下拉(左)+输入(中)+搜索按钮(右，框内) -->
      <div class="search-box">
        <select class="search-engine" id="search-engine" title="搜索引擎">
          <option value="baidu">百度</option>
          <option value="bing">Bing</option>
          <option value="so">360</option>
          <option value="sogou">搜狗</option>
        </select>
        <input class="search-input" id="search-q" value="" placeholder="剧名 / 关键词，如：繁花" onkeydown="if(event.key==='Enter')mockSearch()">
        <button class="search-go" onclick="mockSearch()">🔍</button>
      </div>
      <!-- 搜索结果区 -->
      <div id="search-res" class="sniffeps"></div>
      <!-- 分页（结果下方）-->
      <div id="search-pager" class="search-pager" style="display:none"></div>
      <!-- 搜索记录（合并进本框，最下面：点一下重搜）-->
      <div id="search-hist" class="search-hist"></div>
    </div>

    <!-- 集数（主链路：点搜索结果后出现）-->
    <div class="card hidden" id="ep-card">
      <div class="ep-head">
        <span class="ep-title" id="ep-title">集数</span>
        <span class="ep-total" id="ep-total"></span>
      </div>
      <div class="ep-grid" id="ep-grid"></div>
      <div class="ep-pager" id="ep-pager"></div>
      <div class="ep-detail hidden" id="ep-detail">
        <div class="ep-dt" id="ep-dt">—</div>
        <div class="ep-actions">
          <button class="btn pri" onclick="playEp()">▶ 投屏播放</button>
          <button class="btn gh" onclick="copyEp()">复制链接</button>
          <button class="btn gh" id="ep-fav" onclick="favCurrent()">⭐ 收藏本剧</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══════════ 真实页面查看器（点击搜索结果 → WebView 渲染 → iframe 显示，不归一化/不去广告）═══ -->
  <!-- ═══════════ 搜索结果页（独立页，效仿 searxng 聚合）═══ -->
  <!-- ═══════════ 媒体库（移植 OnScreen UI 结构：继续观看行 + 海报墙）═══ -->
  <div class="page" id="page-library">
    <!-- 继续观看行（学 OnScreen ContinueWatching：大卡 + 进度条 + 点击续投屏）-->
    <div class="lib-sec" id="lib-continue-sec">
      <h2>继续观看</h2>
      <div class="row-scroll" id="continue-row"></div>
    </div>
    <!-- 海报墙（学 OnScreen Row/LibraryRow：横向滚动海报网格）-->
    <div class="lib-sec" id="lib-poster-sec">
      <h2>媒体库 <span id="lib-total" class="dim"></span></h2>
      <div class="row-scroll" id="poster-row"></div>
    </div>
    <div id="lib-empty" class="lib-empty">搜过的剧会出现在这里，点海报看集数<br><button class="btn pri" onclick="goPage('search')">去搜索</button></div>
  </div>

  <!-- ═══════════ 操作台 ═══════════ -->
  <div class="page" id="page-dock">
    <div class="layer-bar"><button class="btn gh" onclick="backFromLayer()">← 返回</button><b>遥控器</b></div>
    <div class="dock" id="dock">
      <div class="dock-cover">
        <div class="cover-tv">📺</div>
        <span class="cover-live" id="dock-live">LIVE</span>
      </div>
      <div class="dock-title" id="dock-title">未在播放</div>
      <div class="dock-sub" id="dock-sub">目标电视：—</div>

      <div class="bigseek" id="bigseek">
        <div class="bigseek-track">
          <div class="bigseek-fill" id="bigseek-fill"></div>
          <div class="bigseek-knob" id="bigseek-knob"></div>
        </div>
        <div class="bigseek-time">
          <span class="cur" id="d-cur">00:00</span>
          <span id="d-dur">00:00</span>
        </div>
      </div>

      <div class="bigbtns">
        <button class="bbtn main" id="d-play" onclick="togglePlay()" title="播放/暂停">▶</button>
      </div>

      <div class="bigvol">
        <span class="vic" id="d-vol-ic">🔊</span>
        <input type="range" class="vrange" id="d-vol" min="0" max="100" value="50"
          oninput="volPreview(this.value)" onchange="ctl('volume', this.value)">
        <span class="vnum" id="d-vol-num">50</span>
      </div>

      <div class="dock-meta">
        <div class="dm">传输<b id="d-bytes">0 B</b></div>
        <div class="dm">速度<b id="d-speed">0 KB/s</b></div>
        <div class="dm">位置<b id="d-pos">0%</b></div>
      </div>
    </div>
  </div>

  <!-- ═══════════ 设备 ═══════════ -->
  <div class="page" id="page-dev">
    <div class="layer-bar"><button class="btn gh" onclick="backFromLayer()">← 返回</button><b>设备</b></div>
    <div class="card">
      <h2>设备</h2>
      <div class="bubbles" id="bubbles"><div class="bub-empty">加载中…</div></div>
      <button class="btn gh" onclick="rescan()">重新扫描</button>
    </div>
  </div>

  <!-- ═══════════ 设置（高级嗅探 + 日志 + 关于）═══════════ -->
  <div class="page" id="page-logs">
    <div class="card">
      <h2>运行日志（/api/logs）</h2>
      <div class="log-toolbar">
        <input class="inp" id="log-filter" placeholder="过滤关键词（如 sniff/cast/search）" oninput="logFilter=this.value">
        <select class="inp" id="log-level" onchange="logLevel=this.value">
          <option value="">全部</option>
          <option value="INFO">INFO</option>
          <option value="WARN">WARN</option>
          <option value="ERROR">ERROR</option>
        </select>
        <button class="btn" onclick="clearLogs()">清空</button>
        <button class="btn" id="log-pause-btn" onclick="toggleLogPause()" title="暂停/继续刷新">⏸</button>
      </div>
      <div class="logbox" id="log-list"><div class="dim">加载中…</div></div>
    </div>
  </div>

  <div class="page" id="page-set">
    <div class="card">
      <h2>账号固化（搜索引擎登录态）</h2>
      <div class="dim" style="margin-bottom:8px">登录一次自动保存，以后搜索自动带上（360 需登录态才能搜）。</div>
      <div class="recent" id="cookie-list"><div class="dim">加载中…</div></div>
    </div>
  </div>
</div>

<!-- ═══════════ 详情浮层（学 OnScreen ItemDetail：封面+标题+集数网格+播放）═══ -->
<div id="detail-overlay" class="detail-overlay hidden">
  <div class="detail-cover" id="detail-cover">?</div>
  <div class="detail-body">
    <div class="detail-title" id="detail-title">…</div>
    <div class="detail-card hidden" id="detail-card">
      <div class="row" id="dc-actors"><span class="k">主演</span><span class="v"></span></div>
      <div class="row" id="dc-director"><span class="k">导演</span><span class="v"></span></div>
      <div class="row" id="dc-region"><span class="k">地区</span><span class="v"></span></div>
      <div class="row" id="dc-extra"><span class="k">类型</span><span class="v"></span></div>
      <div class="detail-synopsis" id="dc-synopsis"></div>
      <span class="detail-synopsis-toggle" id="dc-toggle" onclick="toggleSynopsis()">展开 ⌄</span>
    </div>
    <div class="detail-meta dim" id="detail-meta">提取集数中…</div>
    <div class="detail-eps" id="detail-eps"></div>
  </div>
  <div class="detail-bar">
    <button class="btn pri detail-close-btn" onclick="closeDetail()">关闭</button>
    <button class="btn gh detail-play-btn" id="detail-local" onclick="playEpLocal()" disabled>📱 本地播放</button>
    <button class="btn gh detail-play-btn" id="detail-play" onclick="playEp()" disabled>▶ 投屏</button>
    <button class="btn gh detail-play-btn" id="detail-copy" onclick="copyEp()" disabled>📋 复制</button>
    <button class="btn gh detail-play-btn" id="detail-fav" onclick="favCurrent()">⭐ 收藏</button>
  </div>
</div>

<!-- ═══════════ 内置播放器（ArtPlayer 现代 UI；m3u8 用 hls.js 解码）═══ -->
<div id="player-overlay" class="player-overlay hidden">
  <div class="player-bar">
    <span class="player-title" id="player-title">…</span>
    <button class="player-btn" id="pc-cast" onclick="castFromPlayer()" title="投到电视（先选设备）" style="color:var(--acc)">📺</button>
    <button class="player-btn" id="pc-prev" onclick="prevEp()" disabled>⏮</button>
    <button class="player-btn" id="pc-next" onclick="nextEp()" disabled>⏭</button>
    <button class="player-btn" onclick="closePlayer()">✕</button>
  </div>
  <div id="artplayer-app" class="artplayer-app"></div>
  <button id="player-tap" class="player-tap hidden" onclick="playTap()">▶ 点这里开始播放</button>
</div>

<div id="toast"></div>

<!-- ═══════════ 底部导航（层叠页 dock/dev 不进导航，靠流程进入）═══════════ -->
<nav class="tabbar">
  <div class="tab active" data-page="search" onclick="goPage('search')"><span class="ti">🔍</span><span class="tt">搜索</span></div>
  <div class="tab" data-page="library" onclick="goPage('library')"><span class="ti">🎬</span><span class="tt">媒体库</span></div>

  <div class="tab" data-page="logs" onclick="goPage('logs')"><span class="ti">📋</span><span class="tt">日志</span></div>
</nav>

<script>
const SELF_NAME = "MyCast";

// ── 页面切换 ──
let curPage = 'home';
let layerFrom = 'search'; // 层叠页（遥控器/设备）返回时回哪个主页面
function goPage(p) {
  // 进层叠页时记住来源；从别的层叠页跳过来时保留原来源
  if((p === 'dock' || p === 'dev') && ['search','library','set','logs'].includes(curPage)) layerFrom = curPage;
  curPage = p;
  document.querySelectorAll('.page').forEach(x => x.classList.toggle('active', x.id === 'page-'+p));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.page === p));
  if(p === 'set') { loadCookies(); loadEngines(); } // 进设置页刷账号固化+引擎开关
  if(p === 'library') loadLibrary(); // 进媒体库页刷继续观看+海报墙
  if(p === 'logs') pollLogs(); // 进日志页刷日志
  if(p === 'search') loadSearchHistory(); // 进搜索页刷搜索记录
}
function backFromLayer() { goPage(layerFrom); }

// ═══════════ 搜索结果页（独立页，效仿 searxng 聚合）═══════
// mock 数据：先给用户看格式（标题/URL/摘要/引擎），后续接真搜索
const ENGINE_META = {
  baidu:{name:'百度',   icon:'百'},
  bing: {name:'Bing',   icon:'B'},
  so:   {name:'360',    icon:'36'},
  sogou:{name:'搜狗',   icon:'狗'},
};
let srResults = []; // 当前真实搜索结果（/api/search 返回）
let srPn = 0; // 搜索分页（0 起，下一页+1）
let srNoMore = false; // 已到最后一页（下一页按钮禁用，不再空搜）

// 统一 API：带超时 + 明确错误（避免前端一直转圈没反馈）
async function apiGet(path, timeoutMs=30000) {
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), timeoutMs);
  try {
    const r = await fetch(path, {signal: ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json().catch(()=>{ throw new Error('响应解析失败'); });
  } finally { clearTimeout(t); }
}
// 后端断连：只弹一次 toast + 常驻小角标（轮询不刷屏）
let _netFails = 0, _netRetry = false;
function netFail(where) {
  if(_netFails++ === 0) toast(where+'失败，正在重试…', false);
  let b = document.getElementById('net-off');
  if(!b) { b=document.createElement('div'); b.id='net-off'; b.className='net-off'; document.body.appendChild(b); }
  b.textContent = '⚠ 后端连接异常，重试中';
  // 一次性自动重试：首页不轮询，单次抖动不能让它永久挂着
  if(!_netRetry) { _netRetry = true; setTimeout(()=>{ _netRetry=false; refresh(); pollPlay(); }, 3000); }
}
function netOk() {
  _netRetry = false;
  if(_netFails) { _netFails=0; const b=document.getElementById('net-off'); if(b) b.remove(); }
}
let srOnlyZiYuan = false; // 前端过滤开关：只看资源站（默认全量）

// 真搜索（单引擎 HTTP）：读下拉选引擎 → /api/search?engine=xxx&pn=0 → 结果 + 分页按钮
async function mockSearch() {
  const q = document.getElementById('search-q')?.value.trim() || '';
  if(!q) { toast('输入关键词', false); return; }
  srPn = 0; srNoMore = false; // 新搜索回首页
  await doSearch(q);
}

// 实际搜索（带分页）
async function doSearch(q) {
  const box = document.getElementById('search-res');
  const eng = document.getElementById('search-engine')?.value || 'baidu';
  const em = ENGINE_META[eng] || {name:eng};
  box.innerHTML = '<div class="dim">'+em.name+' 第 '+(srPn+1)+' 页 搜索中…</div>';
  try {
    const d = await apiGet('/api/search?q='+encodeURIComponent(q)+'&engine='+encodeURIComponent(eng)+'&pn='+srPn, 40000);
    netOk();
    if(d.ok && (d.results||[]).length) { showSearchResults(d.results, box); return; }
    // 空页：标记为最后一页，保留当前页结果（不再递归重搜，也不回退页码）
    if(srPn > 0) {
      srNoMore = true;
      toast('已经是最后一页了', false);
      if(!srResults.length) box.innerHTML = '<div class="warn">这一页没有结果，点「上一页」返回</div>';
      else renderSearchList(); // 保留上一页结果 + 禁用下一页
      return;
    }
    if(d.need_browser) { box.innerHTML = '<div class="warn">'+escapeHtml(d.msg||'需浏览器渲染')+'</div>'; return; }
    box.innerHTML = '<div class="warn">'+escapeHtml(d.msg||'搜不到结果')+'</div>';
  } catch(e) {
    const timeout = /abort/i.test(e.name||'');
    box.innerHTML = '<div class="warn">'+(timeout?'搜索超时（40s），稍后重试':'网络错误: '+escapeHtml(e.message))+'</div>';
    netFail('搜索');
  }
}

// 前端过滤开关（全量 / 只看资源站，随时开）
function setSearchFilter(only) { srOnlyZiYuan = !!only; renderSearchList(); }

// 下一页 / 上一页（同一引擎同一关键词）
function searchNext() {
  const q=document.getElementById('search-q')?.value.trim()||''; if(!q)return;
  if(srNoMore) { toast('已经是最后一页了', false); return; }
  srPn++; doSearch(q);
}
function searchPrev() {
  const q=document.getElementById('search-q')?.value.trim()||''; if(!q)return;
  if(srPn>0) { srPn--; srNoMore=false; doSearch(q); }
}

// 显示搜索结果
function showSearchResults(results, box) {
  srResults = results||[];
  renderSearchList();
  toast('搜到 '+srResults.length+' 条');
}

// 渲染结果列表（searxng 聚合样式：favicon + 标题 + URL + 摘要 + 引擎）——渲染到搜索页内 #search-res
function renderSearchList() {
  const box = document.getElementById('search-res');
  if(!box) return;
  let list = srResults;
  if(srOnlyZiYuan) list = list.filter(r=> r.isZiYuan || /(vod|voddetail|vodplay|tvplay|m3u8)/i.test(r.url||''));
  if(!list.length) {
    box.innerHTML = '<div class="dim" style="padding:16px 0;text-align:center">'+
      (srOnlyZiYuan ? '本页没有资源站结果，点「全部」看全部，或翻页' : '没有结果')+'</div>';
    return;
  }
  box.innerHTML = '<div class="sres">'+list.map(r => {
    const em = ENGINE_META[r.engine] || {name:r.engine, icon:(r.engine||'?')[0]};
    const desc = r.desc || r.snippet || ''; // 真结果可能无摘要
    const zy = r.isZiYuan; // 资源站（vodplay/voddetail）→ 可收藏到媒体库（一条路：搜资源站→收藏→媒体库→投屏）
    const zyMark = zy ? '<span style="color:var(--acc);font-size:12px;margin-left:6px">★</span>' : '';
    const favBtn = zy ? '<span style="color:var(--acc);font-size:12px;margin-left:8px" onclick="event.stopPropagation();favSearch(\''+escJS(r.url)+'\',\''+escJS(r.title||'')+'\')">＋收藏</span>' : '';
    const site = r.content || ''; // 站点名（baidu 标题末段 _xxx）
    return '<div class="sx-item">' +
      '<div class="sx-ico">'+em.icon+'</div>' +
      '<div class="sx-main" onclick="pickSite(\''+r.url.replace(/'/g,"\\'")+'\',\''+(r.title||r.url||'').replace(/'/g,"\\'")+'\')">' +
        '<div class="sx-title">'+(r.title||r.url)+zyMark+'</div>' +
        '<div class="sx-url" style="color:var(--acc);font-weight:600">'+(site||em.name)+'</div>' +
        (desc ? '<div class="sx-desc">'+escapeHtml(desc)+'</div>' : '') +
        '<div class="sx-meta"><span class="sx-eng">'+em.name+'</span>'+favBtn+'</div>' +
      '</div>' +
    '</div>';
  }).join('')+'</div>';
  // 前端过滤开关（结果顶部：全部 / 只看资源站，随时切）
  let fb=document.getElementById('search-filter');
  if(!fb){ fb=document.createElement('div'); fb.id='search-filter'; document.getElementById('search-res').insertAdjacentElement('beforebegin',fb); }
  fb.className='search-pager'; fb.style.display='flex'; fb.style.borderTop='none'; fb.style.marginTop='0';
  fb.innerHTML='<span class="dim" style="font-size:12px;margin-right:4px">显示</span>'+
    '<button class="sp-btn" onclick="setSearchFilter(false)"'+(!srOnlyZiYuan?' style="border-color:var(--acc);color:var(--acc)"':'')+'>全部 ('+srResults.length+')</button>'+
    '<button class="sp-btn" onclick="setSearchFilter(true)"'+(srOnlyZiYuan?' style="border-color:var(--acc);color:var(--acc)"':'')+'>只看资源站</button>';
  // 分页按钮（独立容器 #search-pager，固定结果下方，不跟结果滚）
  let pg=document.getElementById('search-pager');
  if(!pg){ pg=document.createElement('div'); pg.id='search-pager'; document.getElementById('search-res').insertAdjacentElement('afterend',pg); }
  const em=ENGINE_META[(document.getElementById('search-engine')?.value||'baidu')]||{};
  pg.className='search-pager';
  pg.style.display='flex';
  pg.innerHTML='<button class="sp-btn" onclick="searchPrev()"'+(srPn===0?' disabled':'')+'>← 上一页</button>'+
    '<span class="sp-cur">第 <b>'+(srPn+1)+'</b> 页 · '+srResults.length+' 条</span>'+
    '<button class="sp-btn" onclick="searchNext()"'+(srNoMore?' disabled':'')+'>'+(srNoMore?'已是最后一页':'下一页 →')+'</button>';
}
function openSearchUrl(u) { window.open(u, '_blank'); }

// ── 账号固化（搜索引擎登录态 cookie 持久化）──
const SE_ENGINES = [
  { engine: 'baidu', name: '百度' },
  { engine: 'so',    name: '360搜索' },
  { engine: 'bing',  name: 'Bing' },
  { engine: 'sogou', name: '搜狗' },
];

// 百度扫码登录（纯 HTTP，显示二维码 → 手机扫 → 轮询拿 BDUSS 固化）
let _qrTimer=null;
async function qrLoginBaidu() {
  toast('获取扫码中…');
  try {
    const d = await (await fetch('/api/login/qrcode')).json();
    if(!d.ok) { toast(d.msg||'获取二维码失败', false); return; }
    // 显示二维码（img 加载 d.imgurl）
    let el=document.getElementById('qr-login-box');
    if(!el){
      el=document.createElement('div'); el.id='qr-login-box'; el.className='card';
      el.style.margin='8px 0';
      const card=document.getElementById('cookie-list').parentElement; card.appendChild(el);
    }
    el.innerHTML='<div style="text-align:center;padding:12px">'+
      '<img src="/api/login/qrcode/img?sign='+encodeURIComponent(d.sign)+'" style="width:200px;height:200px;border-radius:8px" alt="QR">'+
      '<div class="dim" id="qr-status" style="margin-top:8px">请用百度 App 扫码…</div></div>';
    toast('已显示二维码，请扫码');
    // 轮询 /api/login/poll?sign=xxx 直到 logged_in
    const sign=d.sign;
    let tries=0;
    if(_qrTimer) clearInterval(_qrTimer);
    _qrTimer=setInterval(async()=>{
      tries++;
      try{
        const p=await (await fetch('/api/login/poll?sign='+encodeURIComponent(sign))).json();
        const st=document.getElementById('qr-status');
        if(p.ok&&p.status==='logged_in'){
          clearInterval(_qrTimer); _qrTimer=null;
          if(st) st.textContent='✅ 登录成功，BDUSS 已固化';
          toast('百度登录成功，cookie 已保存');
          setTimeout(()=>{ if(el) el.innerHTML=''; },2000);
          loadCookies(); // 刷新状态
        } else if(p.status==='expired'||tries>120){
          clearInterval(_qrTimer); _qrTimer=null;
          if(st) st.textContent='⚠️ 二维码过期，点重新获取';
          toast('二维码过期', false);
        } else if(p.status==='scanned'){
          if(st) st.textContent='已扫码，请在手机上确认…';
        }
      }catch(e){}
    },2000);
  } catch(e) { toast('扫码失败: '+e.message, false); }
}

// 查看各引擎 cookie 固化状态（登录一次自动保存，以后搜索自动带上）
async function loadCookies() {
  try {
    const r = await fetch('/api/cookie/list');
    const d = await r.json();
    const eng = d.engines || {};
    // baidu 登录态（扫码 BDUSS）
    let baiduStatus = '未登录';
    try {
      const s = await (await fetch('/api/login/status')).json();
      if(s.ok && s.login_status==='logged_in') baiduStatus = '✅ 已扫码登录（'+(s.cookie_count||0)+' 条）';
      else if(s.ok && s.cookie_count>0) baiduStatus = '✅ 已固化 '+s.cookie_count+' 条';
    } catch(e){}
    document.getElementById('cookie-list').innerHTML = SE_ENGINES.map(e=>{
      const n = eng[e.engine] || 0;
      let sub, btn;
      if(e.engine==='baidu') {
        sub = baiduStatus;
        btn = '<button class="btn pri" style="width:auto;flex-shrink:0;height:32px" onclick="qrLoginBaidu()">扫码登录</button>';
      } else {
        sub = n>0 ? ('✅ 已固化 '+n+' 条') : '⚠️ 未固化';
        btn = '';
      }
      return '<div class="recent-it">' +
        '<span style="font-size:18px">🔑</span>' +
        '<div class="recent-t"><div class="recent-title">'+e.name+'</div>' +
        '<div class="recent-sub">'+sub+'</div></div>' +
        btn +
        '</div>';
    }).join('');
  } catch(e){ document.getElementById('cookie-list').innerHTML = '<div class="dim">状态加载失败</div>'; }
}

// ── toast ──
function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.innerHTML = '<span class="'+(ok?'ok':'err')+'">'+msg+'</span>';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.innerHTML=''; }, 3000);
}

// ── 资源嗅探（主链路：搜索点结果 or 设置页粘贴 URL，集数都在首页）──
let epsData = [];
let epsPage = 1;
const EPS_PER_PAGE = 30;
let selEp = null;

// 设置页：粘贴 URL → 嗅探（结果自动回首页集数列表）
function sniffURL() {
  const u = document.getElementById('sniff-url').value.trim();
  if(!u) { toast('请输入链接', false); return; }
  sniff(u, '');
}

// 主链路嗅探：对 URL 提取集数（首页集数卡）+ WebView 兜底
async function sniff(u, title) {
  if(!u) { toast('请输入链接', false); return; }
  epLoading('提取集数中…（慢站约 10-15 秒）'); // 原地（#ep-card 在搜索页，不切页）
  try {
    const d = await apiGet('/api/sniff?url='+encodeURIComponent(u), 45000);
    netOk();
    if(d.ok && d.episodes && d.episodes.length) {
      window.__detailURL = u; window.__detailTitle = title || u; window.__curMedia = null;
      syncFavButtons((window.__libItems || []).some(x => x.url === u));
      loadMeta(u); // 真简介/真封面异步补齐，收藏时能带走真海报
      renderEpsGrid(d.episodes, title || d.url || ''); toast('找到 '+(d.episodes||[]).length+' 集'); return;
    }
    // 失败（/api/sniff 返回 200+ok:false，看 d.ok）——明确反馈
    if(d.need_browser) { epFail('该站 JS 反爬（需浏览器内核），本路径纯 HTTP 解不了，换一条结果试试'); return; }
    const m=d.msg||'';
    if(/connection|refused|dial|timeout|no such host|EOF|no episodes/i.test(m)) {
      epFail(/no episodes/i.test(m)?'提不出集数（该站结构不识别），换一条结果试试':'该站连不上（可能挂了），换一条结果试试');
    } else {
      epFail('提不出（'+(m||'未知')+'），换一条结果试试');
    }
  } catch(e) {
    epFail(/abort/i.test(e.name||'') ? '嗅探超时（45s），换一条结果试试' : '网络错误，换一条结果试试');
    netFail('嗅探');
  }
}
// 嗅探失败：原地醒目提示（#ep-card 顶部红色条）+ toast
function epFail(msg) {
  const c = document.getElementById('ep-card');
  if(c) {
    c.classList.remove('hidden');
    let bar = document.getElementById('ep-fail');
    if(!bar){ bar=document.createElement('div'); bar.id='ep-fail'; c.insertBefore(bar, c.firstChild); }
    bar.className='ep-fail-bar';
    bar.style.cssText='padding:10px 14px;margin-bottom:10px;border-radius:10px;background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.35);color:#ff8a8a;font-size:13px;line-height:1.5';
    bar.innerHTML='<span style="font-weight:700;margin-right:6px">✗</span>'+msg;
  }
  toast(msg, false);
}

// ═══════════ 媒体库（移植 OnScreen UI 结构：继续观看行 + 海报墙）═══
// 纯流媒体索引：从不产生文件/本地存，只记录看过/搜过的剧（流媒体源）。
function libEmoji(title) {
  // 无海报图（盗版站无标准封面），用标题首字做占位（学 OnScreen assetUrl，但不用 /artwork 文件）
  const t = (title||'?').trim();
  return t ? t[0].toUpperCase() : '?';
}

async function loadLibrary() {
  try {
    const r = await fetch('/api/library');
    const d = await r.json();
    const items = d.items || [];
    window.__libItems = items; // 供 getPlayPos 读后端进度（SQLite）
    const cRow = document.getElementById('continue-row');
    const pRow = document.getElementById('poster-row');
    const empty = document.getElementById('lib-empty');
    const cSec = document.getElementById('lib-continue-sec');
    const pSec = document.getElementById('lib-poster-sec');
    pSec.style.display = items.length ? '' : 'none';
    empty.style.display = items.length ? 'none' : '';
    document.getElementById('lib-total').textContent = items.length ? ('共 '+items.length+' 条') : '';
    if(!items.length) { cSec.style.display = 'none'; return; }

    // 学 OnScreen progressPct：没有真实 offset/duration 就不画进度，不造假 100%。
    // 继续观看只放真有进度的，按进度倒序（OnScreen 空行直接隐藏）。
    const pctOf = it => Math.min(100, Math.max(0, Number(it.progress) || 0));
    const watched = items.filter(it => pctOf(it) > 0).sort((a,b) => pctOf(b)-pctOf(a)).slice(0,6);
    cSec.style.display = watched.length ? '' : 'none';
    cRow.innerHTML = watched.map(it=>{
      const p = pctOf(it);
      const sub = (it.position && it.duration) ? (it.position+' / '+it.duration) : ('看到 '+Math.round(p)+'%');
      return '<div class="continue-card">'+
      '<div class="continue-img" onclick="openDetail(\''+escJS(it.url)+'\',\''+escJS(it.title)+'\')">'+posterImg(it,true)+
      '<div class="continue-progress-track"><div class="continue-progress" style="width:'+p+'%"></div></div></div>'+
      '<button class="continue-dismiss" title="标为未看" onclick="dismissProgress(event,\''+escJS(it.url)+'\')">✕</button>'+
      '<div class="continue-title" onclick="openDetail(\''+escJS(it.url)+'\',\''+escJS(it.title)+'\')">'+it.title+'</div>'+
      '<div class="continue-sub">'+sub+' · '+Math.round(p)+'%</div></div>';
    }).join('');

    // 海报墙：全部横向滚动，卡片底部细进度条一眼看出看过没
    pRow.innerHTML = items.map(it=>{
      const p = pctOf(it);
      return '<div class="poster-card">'+
      '<div class="poster-img" onclick="openDetail(\''+escJS(it.url)+'\',\''+escJS(it.title)+'\')">'+posterImg(it)+
      (p>0 ? '<div class="poster-progress-track"><div class="poster-progress" style="width:'+p+'%"></div></div>' : '')+'</div>'+
      '<div class="poster-title">'+it.title+'</div><div class="poster-sub">'+(it.time||'')+
      ' <span class="poster-unfav" onclick="event.stopPropagation();unfav(\''+escJS(it.url)+'\')">✕</span></div></div>';
    }).join('');
  } catch(e) { toast('媒体库加载失败: '+e.message, false); netFail('媒体库'); }
}

// 学 OnScreen dismissContinue：先乐观移除卡片，失败再回滚重刷
async function dismissProgress(ev, url) {
  const card = ev && ev.target && ev.target.closest ? ev.target.closest('.continue-card') : null;
  if(card) card.style.display = 'none';
  try {
    const d = await apiGet('/api/library/progress?url='+encodeURIComponent(url)+'&progress=0&position=&duration=');
    if(d.ok === false) throw new Error(d.msg || '标记失败');

async function loadDetail(url, title) {

  meta.classList.remove('fail');

      renderDetailEps(d.episodes, title||'');
      loadMeta(url); // 元数据/封面异步补齐：只写真提取到的，绝不编
      return;
    }

  } catch(e) {
    meta.classList.add('fail');
    meta.textContent = /abort/i.test(e.name||'') ? '嗅探超时，换一条结果试试' : '网络错误，换一条结果试试';
    toast(meta.textContent, false); netFail('嗅探');

}

// 真元数据：后端从详情页 JSON-LD/meta/苹果CMS 提取，异步写好后轮询取（最多约 7s）
async function loadMeta(url) {
  for(let i=0;i<6;i++) {
    try {
      const d = await apiGet('/api/sniff/media?url='+encodeURIComponent(url), 5000);
      if(d.ok && d.media) { window.__curMedia = d.media; renderMedia(d.media); return; }
    } catch(e) { /* 还没好，继续等 */ }
    await new Promise(r=>setTimeout(r,1200));
  }
  renderMedia(null); // 抓不到就不显示，不造假简介/封面
}

// ═══════════ 内置播放器（ArtPlayer 现代 UI；m3u8 交给 hls.js 解码）═══
let art = null, artHls = null;
// WebKitGTK（mygo 桌面）检测：它的 MSE/autoplay/PIP 跟 Chrome 不一样，要降配
// mygo 的 UA 实测：Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/60.5 Safari/605.1.15
// 不含 "WebKitGTK" 字样，之前那个判断漏了 → WebKit 降配完全没生效。
const IS_WEBKITGTK = /AppleWebKit/i.test(navigator.userAgent) && !/Chrome|Chromium|Edg/i.test(navigator.userAgent);
function playLocal(url, mime, title, epsCtx) {
  if(!url) { toast('无播放地址', false); return; }
  const ov = document.getElementById('player-overlay');
  ov.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.getElementById('player-title').textContent = title || '本地播放';
  playEps = epsCtx || { eps: [], index: 0 };
  updatePlayerCtl();
  playPosKey = (title || '').trim();
  playPosURL = (selEp && selEp.url) ? selEp.url : '';
  lastSavePos = 0;
  if(art) { art.destroy(); art = null; }
  if(artHls) { artHls.destroy(); artHls = null; }
  const isHLS = (mime||'').indexOf('mpegurl')>=0 || (mime||'').indexOf('m3u8')>=0 || /\.m3u8/.test(url);
  if(!window.Artplayer) { toast('播放器资源未加载（/static/artplayer.min.js）', false); return; }
  // 本地播放不走投屏中转，但远程 m3u8/ts 有 CORS + 防盗链：走轻量 /api/stream 代理。
  const b64url = u => btoa(unescape(encodeURIComponent(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  // 路径式：相对片段会解析到同一 /api/stream/s/<token>/ 前缀，服务端按片段名代理
  const proxied = u => '/api/stream/s/'+b64url(u)+'/index.m3u8?ref='+encodeURIComponent(window.__streamRef||'');
  const proxiedDirect = u => '/api/stream?url='+encodeURIComponent(u)+'&ref='+encodeURIComponent(window.__streamRef||'');
  art = new Artplayer({
    container: '#artplayer-app',
    url: isHLS ? url : proxiedDirect(url),
    title: title || '',
    type: isHLS ? 'm3u8' : undefined,
    customType: {
      m3u8: function(video, src) {
        if(window.Hls && Hls.isSupported()) {
          // WebKitGTK 的 worker MSE 不稳（一播就卡死/崩），关掉 worker + 关自动低延迟
          artHls = new Hls({
            enableWorker: !IS_WEBKITGTK,
            lowLatencyMode: false,
            maxBufferLength: IS_WEBKITGTK ? 10 : 30,
          });
          artHls.attachMedia(video);
          artHls.loadSource(proxied(src)); // 路径式代理；必须先 attachMedia，否则不发清单请求
          artHls.on(Hls.Events.MANIFEST_PARSED, ()=>{
            video.play().catch(err=>{
              // WebKitGTK 异步拿流后失去了用户手势 → 自动播放被拒，画面卡在 loading 圈。
              // 给一个显眼的「点这里播放」按钮（用户一点就有手势，能起播）。
              window.__playerErr = String(err);
              const tap = document.getElementById('player-tap');
              if(tap) tap.classList.remove('hidden');
            });
          });
          artHls.on(Hls.Events.ERROR, (_,data)=>{
            if(!data || !data.fatal) return;
            toast('播放出错：'+(data.type||'')+'，换一集试试', false);
          });
        } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = src; video.play().catch(()=>{});
        } else {
          toast('当前浏览器不支持 m3u8 播放', false);
        }
      },
    },
    autoplay: true,
    muted: false,
    loop: false,
    setting: !IS_WEBKITGTK,     // WebKitGTK 设置面板/PIP/快捷键容易触发渲染崩溃
    playbackRate: true,
    fullscreen: true,
    pip: !IS_WEBKITGTK,
    hotkey: !IS_WEBKITGTK,
    lang: 'zh-cn',
  });
  art.on('video:timeupdate', paintPlayerProgress);
  art.on('video:play', ()=>{ const tap=document.getElementById('player-tap'); if(tap) tap.classList.add('hidden'); window.__playerErr=null; });
  art.on('video:ended', ()=>{
    const n = document.getElementById('pc-next');
    if(n && !n.disabled) nextEp();
  });
}
// 自动播放被拒时的兜底按钮（WebKitGTK 真机实测必需）
function playTap() {
  if(!art) return;
  const tap=document.getElementById('player-tap');
  art.play().then(()=>{ if(tap) tap.classList.add('hidden'); }).catch(err=>{
    window.__playerErr=String(err); toast('播放失败：'+err, false);
  });
}

// ── 播放器增强：上一集/下一集/倍速/全屏 ──
let playEps = { eps: [], index: 0 }; // 当前播放的集数上下文
let playSpeed = 1;

function updatePlayerCtl() {
  const has = playEps.eps.length > 0;
  const prev = document.getElementById('pc-prev');
  const next = document.getElementById('pc-next');
  if(prev) prev.disabled = !has || playEps.index <= 1;
  if(next) next.disabled = !has || playEps.index >= Math.max(...playEps.eps.map(x=>x.index));
}

function prevEp() {
  if(!playEps.eps.length) return;
  const idx = playEps.index - 1;
  const ep = playEps.eps.find(x=>x.index===idx);
  if(ep) playEpLocalCtx(ep, '第'+ep.index+'集');
}

function nextEp() {
  if(!playEps.eps.length) return;
  const idx = playEps.index + 1;
  const ep = playEps.eps.find(x=>x.index===idx);
  if(ep) playEpLocalCtx(ep, '第'+ep.index+'集');
}

// 倍速/全屏/进度条/音量都由 ArtPlayer 内置，旧的自绘控制已删。

function fmtPlayTime(s) {
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}
function paintPlayerProgress() {
  if(!art) return;
  const dur = art.duration || 0, cur = art.currentTime || 0;
  const pct = dur > 0 ? (cur / dur) * 100 : 0;
  if(dur > 0 && pct > 0) savePlayPos(pct);
}

// ── 播放进度归媒体库（SQLite 持久化，跨设备不丢）──
let playPosKey = null;
let playPosURL = '';
let castPosURL = ''; // 当前投屏的剧集 URL（pollPlay 回写进度用）
let lastSavePos = 0;
function savePlayPos(pct) {
  if(!playPosKey || !playPosURL) return;
  // 节流：每 5% 回写一次，减少后端写
  if(Math.abs(pct - lastSavePos) < 5 && pct < 99) return;
  lastSavePos = pct;
  fetch('/api/library/progress?url='+encodeURIComponent(playPosURL)+'&progress='+pct)
    .catch(()=>{});
}
function getPlayPos(url) {
  // 从后端 library 读（SQLite 持久化），跨设备/重装不丢
  try {
    const items = (window.__libItems || []);
    const it = items.find(x=>x.url===url);
    return it && it.progress ? it.progress : 0;
  } catch(e){ return 0; }
}

// 播放指定集（带集数上下文，供上一集/下一集）
let castBusy = false; // 拿流防重复点击（一次只投一集）
function playEpLocalCtx(ep, epTitle) {
  if(!ep || castBusy) return;
  selEp = ep;
  const dt = document.getElementById('detail-title');
  const base = (dt && dt.textContent && dt.textContent!=='…') ? dt.textContent : (document.getElementById('ep-title').textContent || '剧集');
  const title = String(base).replace(/\d+集夹$/, '') + ' 第'+ep.index+'集';
  castBusy = true;
  const dtl = document.getElementById('ep-dt');
  if(dtl) dtl.textContent = '拿流中…（正在找 m3u8/mp4）';
  apiGet('/api/cast?url='+encodeURIComponent(ep.url)+'&title='+encodeURIComponent(title), 35000)
    .then(d=>{
      castBusy = false; netOk();
      if(d.ok) { if(d.ref) window.__streamRef = d.ref; playLocal(d.url, d.mime, title, { eps: epsData, index: ep.index }); }
      else { toast(d.msg||'拿流失败', false); if(dtl) dtl.textContent='拿流失败：'+(d.msg||'未知'); }
    })
    .catch(e=>{
      castBusy = false; netFail('拿流');
      const m = /abort/i.test(e.name||'') ? '拿流超时（35s），换一集或换一条结果' : '拿流网络错误';
      toast(m, false); if(dtl) dtl.textContent = m;
    });
}

function closePlayer() {
  if(art) { art.destroy(); art = null; }
  if(artHls) { artHls.destroy(); artHls = null; }

}

// 集数网格（分页 + 选中 + 投屏）
function renderEpsGrid(eps, title) {
  epsData = eps; epsPage = 1; selEp = null;
  const oldFail = document.getElementById('ep-fail'); if(oldFail) oldFail.remove(); // 清掉上次失败提示
  document.getElementById('ep-card').classList.remove('hidden');
  document.getElementById('ep-title').textContent = title || '集数';
  document.getElementById('ep-total').textContent = '共 '+eps.length+' 集';

}
function drawEpGrid() {
  const start = (epsPage-1)*EPS_PER_PAGE;
  const page = epsData.slice(start, start+EPS_PER_PAGE);
  document.getElementById('ep-grid').innerHTML = page.map((e,i)=>
    '<div class="ep-cell'+(selEp && selEp.url===e.url?' on':'')+'" onclick="selectEp('+i+')">'+e.index+'</div>'
  ).join('');
  const pages = Math.ceil(epsData.length/EPS_PER_PAGE);
  let pg = '';
  if(pages > 1) {
    pg = '<div class="ep-pg'+(epsPage===1?' on':'')+'" onclick="gotoEp(1)">«</div>';
    for(let i=Math.max(1,epsPage-2); i<=Math.min(pages,epsPage+2); i++) pg += '<div class="ep-pg'+(i===epsPage?' on':'')+'" onclick="gotoEp('+i+')">'+i+'</div>';
    pg += '<div class="ep-pg'+(epsPage===pages?' on':'')+'" onclick="gotoEp('+pages+')">»</div>';
  }
  document.getElementById('ep-pager').innerHTML = pg;
}
function gotoEp(p) { epsPage = p; drawEpGrid(); }
function selectEp(idx) {
  const e = epsData[(epsPage-1)*EPS_PER_PAGE + idx];
  if(!e) return;
  selEp = e;
  document.querySelectorAll('.ep-cell').forEach((c,i)=>c.classList.toggle('on', i===idx));

// ── 投屏分层：播放器点📺 → 设备页选电视 → 选完才真投屏 → 进遥控器页 ──
let pendingCast = null; // 待投屏的当前集（播放器点📺时记下）
function castFromPlayer() {
  if(!selEp) { toast('先选一集再投屏', false); return; }
  const raw = document.getElementById('player-title')?.textContent || '';
  const title = raw.replace(/\s*第\d+集$/, '') || '剧集';

  pendingCast = { url: selEp.url, title: title, index: selEp.index };
  goPage('dev');
  toast('选一台电视，选完自动投屏');
}

async function playEp() {
  if(!selEp || castBusy) return;
  const dt = document.getElementById('detail-title');
  const base = (dt && !dt.classList.contains('hidden') && dt.textContent && dt.textContent!=='…') ? dt.textContent : (document.getElementById('ep-title').textContent || '剧集');
  const title = String(base).replace(/\d+集夹$/, '') + ' 第'+selEp.index+'集';
  doCast({ url: selEp.url, title: title, index: selEp.index });
}

// 真正投屏：确认已选电视 → 拿流 → 投出去 → 才进遥控器页
async function doCast(info) {
  if(!info || !info.url || castBusy) return;
  try {
    const st = await apiGet('/api/status');
    if(!st.status || !st.status.tv) {
      // 先在设备页选电视：记住这一集，选完自动接着投屏，不用再点第二次
      pendingCast = info;
      closeDetail(); // 浮层是 fixed 盖在最上层，不关掉就看不见设备页
      toast('还没选电视，选一台后自动投屏');
      goPage('dev');
      return;
    }
  } catch(e) { toast('无法确认电视状态: '+e.message, false); netFail('状态检查'); return; }
  castBusy = true;
  toast('拿流中…');
  try {
    const d = await apiGet('/api/cast/push?url='+encodeURIComponent(info.url)+'&title='+encodeURIComponent(info.title), 35000);
    castBusy = false; netOk();
    if(d.ok) {
      castPosURL = info.url;
      toast('已投屏第'+(info.index||'')+'集'); closeDetail(); goPage('dock');
    } else toast('拿流失败：'+(d.msg||'未知'), false);
  } catch(e) {
    castBusy = false; netFail('拿流');
    toast(/abort/i.test(e.name||'') ? '拿流超时（35s），换一集或换一条结果' : '拿流网络错误', false);
  }
}

// ── 工具 ──
function fmtBytes(n) {
  if(n < 1024) return n+' B';
  if(n < 1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const p = n => String(n).padStart(2,'0');
  return h > 0 ? h+':'+p(m)+':'+p(s) : p(m)+':'+p(s);
}

// ── 控制 API ──
let curPaused = false;
function togglePlay() {
  // 乐观翻转本地状态，立即响应，电视回包后校准
  curPaused = !curPaused;
  document.getElementById('d-play').textContent = curPaused ? '▶' : '⏸';
  ctl(curPaused ? 'play' : 'pause');
}
function ctl(action, arg) {
  let url = '/api/play?action='+action;
  if(arg !== undefined) url += '&arg='+encodeURIComponent(arg);
  fetch(url).then(r=>r.json()).then(d=>{
    if(!d.ok) { toast(d.msg||'操作失败', false); pollPlay(); }  // 失败则回读真实状态
    else if(action==='volume') toast('音量 '+arg);
    else if(action==='play') toast('继续播放');
    else if(action==='pause') toast('已暂停');
    else pollPlay();
  }).catch(()=>toast('网络错误', false));
}

function volPreview(v) {
  document.getElementById('d-vol-num').textContent = v;
  document.getElementById('d-vol-ic').textContent = v==0?'🔇':(v<40?'🔉':'🔊');
}

// ── 操作台大进度条（拖动 seek）──
let seeking = false, seekPct = 0;
function seekPctFromEvent(e) {
  const el = document.getElementById('bigseek');
  const r = el.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return Math.max(0, Math.min(100, x / r.width * 100));
}
function initSeek() {
  const el = document.getElementById('bigseek');
  const start = e => {
    if(!curDuration) return;
    e.preventDefault(); seeking = true;
    seekPct = seekPctFromEvent(e);
    el.classList.add('dragging'); paintSeek(seekPct);
  };
  const move = e => {
    if(!seeking) return;
    e.preventDefault(); seekPct = seekPctFromEvent(e); paintSeek(seekPct);
  };
  const end = () => {
    if(!seeking) return;
    seeking = false; el.classList.remove('dragging');
    ctl('seek', Math.round(curDuration * seekPct / 100));
  };
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);
}

let curDuration = 0;
function paintSeek(pct) {
  document.getElementById('bigseek-fill').style.width = pct+'%';
  document.getElementById('bigseek-knob').style.left = pct+'%';
}

function parseTVTime(s) {
  if(!s) return 0;
  s = String(s).trim();
  if(s.indexOf(':') >= 0) {
    const p = s.split(':').map(x=>parseInt(x,10)||0);
    if(p.length===3) return p[0]*3600+p[1]*60+p[2];
    if(p.length===2) return p[0]*60+p[1];
    return p[0]||0;
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

// ── 播放状态轮询（操作台 + 首页）──
let wasPlaying = false;
function pollPlay() {
  fetch('/api/play/status').then(r=>r.json()).then(d=>{
    const p = d.play || {};
    const playing = !!p.title || p.bytes > 0 || !!p.state;

    // 自动进操作台：首次检测到播放
    if(playing && !wasPlaying) goPage('dock');
    wasPlaying = playing;

    // 操作台
    const dock = document.getElementById('dock');
    const st = (p.state||'').toUpperCase();
    const isPaused = st === 'PAUSED_PLAYBACK' || st === 'PAUSED_RECORDING';
    const isLive = st === 'PLAYING' || st === 'TRANSITIONING';
    // 仅在电视明确返回 state 时校准（未选电视/无 state 时保留乐观状态）
    if(p.state) curPaused = isPaused;

    document.getElementById('d-play').textContent = curPaused ? '▶' : '⏸';
    document.getElementById('dock-live').textContent = isPaused ? 'PAUSED' : 'LIVE';
    document.getElementById('dock-live').style.background = isPaused ? 'var(--warn)' : 'var(--acc)';
    document.getElementById('dock-title').textContent = p.title || '播放中';

    let dur = 0, cur = 0;
    const tvDur = parseTVTime(p.duration), tvPos = parseTVTime(p.position);
    if(tvDur > 0) { dur = tvDur; cur = tvPos; }
    else { dur = p.total || 0; cur = p.elapsed || 0; }
    curDuration = dur;

    if(!seeking) {
      const pct = dur > 0 ? Math.max(0, Math.min(100, cur/dur*100)) : (p.percent||0);
      paintSeek(pct);
      // 投屏进度回写媒体库（SQLite）：当前投的剧集 URL
      if(castPosURL && pct > 0) {
        const posStr = dur>0 ? fmtTime(cur) : '';
        const durStr = dur>0 ? fmtTime(dur) : '';
        fetch('/api/library/progress?url='+encodeURIComponent(castPosURL)+'&progress='+pct+'&position='+encodeURIComponent(posStr)+'&duration='+encodeURIComponent(durStr))
          .catch(()=>{});
      }
    }
    document.getElementById('d-cur').textContent = fmtTime(cur);
    document.getElementById('d-dur').textContent = dur > 0 ? fmtTime(dur) : '--:--';
    document.getElementById('d-bytes').textContent = fmtBytes(p.pos_bytes||0);
    document.getElementById('d-speed').textContent = p.speed > 0 ? p.speed.toFixed(0)+' KB/s' : '—';
    document.getElementById('d-pos').textContent = (p.percent||0).toFixed(0)+'%';

    if(p.volume !== undefined && p.volume !== '' && !volDragging) {
      const v = parseInt(p.volume,10);
      if(!isNaN(v)) { document.getElementById('d-vol').value = v; volPreview(v); }
    }

    // 首页小卡（老版卡片已删，元素不存在就跳过——别让它抛异常被 catch 吞成"后端断连"）
    const sp = document.getElementById('st-playing');
    if(sp) { sp.textContent = p.title || '—'; sp.className = 'sv ' + (playing?'ok':'dim'); }
    const ss = document.getElementById('st-speed');
    if(ss) ss.textContent = p.speed > 0 ? p.speed.toFixed(0)+' KB/s' : '—';

    // 首页投屏横幅（正在播放 → 可点进遥控器）
    const bn = document.getElementById('cast-banner');
    if(bn) {
      if(playing) { bn.classList.remove('hidden'); const ct=document.getElementById('cb-title'); if(ct) ct.textContent = p.title||'正在播放'; }
      else bn.classList.add('hidden');
    }
    netOk();
  }).catch(()=>netFail('播放状态'));
}
let volDragging = false;

// ── 状态刷新 ──
function refresh() {
  fetch('/api/status').then(r=>r.json()).then(d=>{
    const s = d.status;

    // tv
    const tvEl = document.getElementById('st-tv');
    if(tvEl) {
      if(s.tv) { tvEl.textContent = s.tv; tvEl.className='sv ok'; }
      else { tvEl.textContent = '未选择'; tvEl.className='sv warn'; }
    }

    // 首页 hero
    const heroT = document.getElementById('hero-t');
    const heroS = document.getElementById('hero-s');
    const heroB = document.getElementById('hero-badge');
    const heroI = document.getElementById('hero-ic');
    if(!(heroT && heroS && heroB && heroI)) { /* 老版首页 hero 已删，跳过 */ }
    else if(s.ses_title) {
      heroI.textContent = '📺';
      heroT.textContent = s.ses_title;
      heroS.textContent = '正在投屏到 ' + (s.tv || '电视');
      heroB.textContent = '● 播放中'; heroB.className = 'hero-badge live';
    } else if(s.tv) {
      heroI.textContent = '✅';
      heroT.textContent = '已选电视';
      heroS.textContent = s.tv + ' · 就绪';
      heroB.textContent = '● 就绪'; heroB.className = 'hero-badge live';
    } else {
      heroI.textContent = '📡';
      heroT.textContent = '等待投屏';
      heroS.textContent = '选电视 → 搜剧 → 投屏';
      heroB.textContent = '● 就绪'; heroB.className = 'hero-badge idle';
    }

    const ds = document.getElementById('dock-sub');
    if(ds) ds.textContent = '目标电视：' + (s.tv || '未选择');

    // err
    const ew = document.getElementById('errbar');
    if(ew) {
      if(s.last_err) { ew.textContent = s.last_err; ew.classList.remove('hidden'); }
      else ew.classList.add('hidden');
    }

    renderBubbles(d.tvs||[], s.tv, s.ses_title);
    netOk();
  }).catch(()=>netFail('状态刷新'));
}

function renderBubbles(tvs, selected, playingTitle) {
  const el = document.getElementById('bubbles');
  // 无中转后「本机 MyCast」不再是一个投屏目标，只显示真实电视
  const realTVs = (tvs || []).filter(t => t.name !== SELF_NAME);

  let html = '';
  if(realTVs.length) {
    realTVs.forEach(t => {
      const sel = t.name === selected;
      html += '<div class="bub'+(sel?' on':'')+'" onclick="selectTV(\''+t.name.replace(/'/g,"")+'\')">'+
        (sel?'<span class="bub-tag on">已选</span>':'')+
        '<div class="bub-ic tv">📺</div>'+
        '<div class="bub-name">'+t.name+'</div>'+
        '<div class="bub-ip">'+t.ip+':'+t.port+'</div>'+
      '</div>';
    });
  }

  if(!realTVs.length) {
    html += '<div class="bub-empty" style="grid-column:auto">'+
      '未发现电视<br>点「重新扫描」试试<br><span style="font-size:9px">电视需与本程序同网段</span></div>';
  }

  el.innerHTML = html;
}

// ── 日志（独立页：走 /api/logs，辅助调试）──
let lastLogs = [];
let logFilter = '';
let logLevel = '';
let logPaused = false;
async function pollLogs() {
  if(logPaused) return;
  try {
    const q = logFilter ? '&q='+encodeURIComponent(logFilter) : '';
    const lv = logLevel ? '&level='+encodeURIComponent(logLevel) : '';
    const r = await fetch('/api/logs?n=200'+q+lv);
    const d = await r.json();
    const el = document.getElementById('log-list');
    if(!el) return;
    const logs = d.logs || [];
    if(JSON.stringify(logs) !== JSON.stringify(lastLogs)) {
      lastLogs = logs;
      el.innerHTML = logs.map(l=>'<div>'+l.replace(/</g,'&lt;')+'</div>').join('');
      el.scrollTop = el.scrollHeight;
    }
  } catch(e){}
}
function toggleLogPause() {
  logPaused = !logPaused;
  document.getElementById('log-pause-btn').textContent = logPaused ? '▶' : '⏸';
}
async function clearLogs() {
  try {
    const d = await apiGet('/api/logs/clear');
    if(d.ok === false) { toast(d.msg||'清空失败', false); return; }
    document.getElementById('log-list').innerHTML = '<div class="dim">已清空（新日志仍会继续追加）</div>';
    lastLogs = [];
  } catch(e) { toast('清空日志失败: '+e.message, false); netFail('清空日志'); }
}

    })

}
