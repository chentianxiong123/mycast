# MyCast CI —— windows/amd64 平台独立构建（纯手动触发，不做自动触发）。
#
# 触发：仅在 Actions 页手动点 Run workflow（workflow_dispatch only）。
# 职责：Windows 桌面产物
name: ci-windows-amd64

on:
  workflow_dispatch: # 纯手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: 交叉编译 windows/amd64（零 CGo 硬约束）
        run: cd go && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/mycast-windows-amd64 ./cmd/mycast
