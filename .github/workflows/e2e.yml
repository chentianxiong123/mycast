# MyCast 后端集成 e2e CI —— 纯手动触发（不做自动触发）。
#
# 重构说明：旧版测 wails3 桌面壳（xvfb 虚拟 X + WebKitGTK + 黑屏检测），依赖 libwebkitgtk/GTK4 系统库。
# 新路线是 Go 后端 + 嵌入式 JS 引擎 + HTTP-first（WebView 降为 L3 兜底），不再需要 WebKitGTK。
#
# 现测跨模块集成（httptest 本地站，无外网依赖，确定性）：
#   - sniff：L0 纯 HTTP → L2 JS 引擎降级链决策
#   - jsexec：嵌入式 JS 引擎执行混淆脚本取流（替代旧 WebView 渲染路径）
#   - httptool：cookie 捕获 + 持久化往返 + http 明文站分流（switchRT）
#
# 触发：仅在 Actions 页手动点 Run workflow。
name: e2e

on:
  workflow_dispatch: # 纯手动触发（Actions 页点 Run），不做自动触发

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: 后端集成 e2e（httptest 本地站，跨 sniff/jsexec/httptool）
        run: cd go && go test ./internal/e2e/... -v -timeout 120s

      - name: 交叉编译硬约束抽查（android/arm64 零 CGo）
        run: cd go && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /tmp/mycast-android-arm64 ./cmd/mycast
