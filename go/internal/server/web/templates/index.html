<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyCast</title>
<link rel="icon" href="data:,">
<script src="/static/hls.min.js">// ── 搜索引擎开关设置 ──
async function loadEngines() {
  try {
    const r = await fetch('/api/config');
    const d = await r.json();
    const engines = d.config?.search_engines || [];
    ['so','baidu','bing'].forEach(e => {
      const cb = document.getElementById('eng-'+e);
      if(cb) cb.checked = engines.includes(e);
    });
  } catch(e){}
}
function saveEngines() {
  const engines = ['so','baidu','bing'].filter(e => document.getElementById('eng-'+e)?.checked);
  if(!engines.length) { toast('至少开一个引擎', false); return; }
  fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({search_engines: engines})})
    .then(r=>r.json())
    .then(d=>{
      if(d.ok) {
        toast('已保存：'+engines.join(','));
        document.getElementById('eng-save-msg').textContent = '已生效，下次搜索使用';
        setTimeout(()=>document.getElementById('eng-save-msg').textContent='', 3000);
      } else toast(d.msg||'保存失败', false);
    })
    .catch(e=>toast('错误: '+e.message, false));
}
</script>
